services:
  # Backend (Laravel + PHP-FPM + Nginx)
  backend:
    network_mode: host
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astro-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./backend/storage/app:/var/www/html/storage/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 77.88.8.8
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=172.18.0.2
      - REDIS_HOST=127.0.0.1
      - TIMEWEB_AI_BASE_URL=https://api.timeweb.ai/v1
      - TIMEWEB_AI_API_KEY=sk-PyIqBw7PvNPDaJp-kqv75w
      - TIMEWEB_AI_MODEL=dashscope/qwen3.5-flash
      - UNISENDER_API_KEY=6z7cio4yqpaws6gsyzx93p15id1xmhimzezgedfy
      - UNISENDER_FROM_EMAIL=no-reply@my.neiro-astro.ru
      - UNISENDER_FROM_NAME="AI Астролог"

  # Frontend (Next.js)
  frontend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astro-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - astro-net
    depends_on:
      - backend

  # Astro Service (Python FastAPI)
  astro-service:
    build:
      context: ./astro-service
      dockerfile: Dockerfile
    container_name: astro-python
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./astro-service:/app
    networks:
      - astro-net
    depends_on:
      - redis
    environment:
      - REDIS_HOST=127.0.0.1
      - TIMEWEB_AI_BASE_URL=https://api.timeweb.ai/v1
      - TIMEWEB_AI_API_KEY=sk-PyIqBw7PvNPDaJp-kqv75w
      - TIMEWEB_AI_MODEL=dashscope/qwen3.5-flash
      - UNISENDER_API_KEY=6z7cio4yqpaws6gsyzx93p15id1xmhimzezgedfy
      - UNISENDER_FROM_EMAIL=no-reply@my.neiro-astro.ru
      - UNISENDER_FROM_NAME="AI Астролог"
      - REDIS_PORT=6380

  # Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: astro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - astro-pgdata:/var/lib/postgresql/data
    networks:
      - astro-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: astro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - astro-redisdata:/data
    networks:
      - astro-net

  # Scheduler (cron jobs)
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astro-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    networks:
      - astro-net
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=172.18.0.2
      - REDIS_HOST=127.0.0.1
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TIMEWEB_AI_BASE_URL=https://api.timeweb.ai/v1
      - TIMEWEB_AI_API_KEY=sk-PyIqBw7PvNPDaJp-kqv75w
      - TIMEWEB_AI_MODEL=dashscope/qwen3.5-flash
      - UNISENDER_API_KEY=6z7cio4yqpaws6gsyzx93p15id1xmhimzezgedfy
      - UNISENDER_FROM_EMAIL=no-reply@my.neiro-astro.ru
      - UNISENDER_FROM_NAME="AI Астролог"

volumes:
  astro-pgdata:
  astro-redisdata:

networks:
  astro-net:
    driver: bridge
