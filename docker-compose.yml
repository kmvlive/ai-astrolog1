services:
  # Backend (Laravel + PHP-FPM + Nginx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astro-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage/app:/var/www/html/storage/app
    networks:
      - astro-net
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - TIMEWEB_AI_BASE_URL=https://api.timeweb.ai/v1
      - TIMEWEB_AI_API_KEY=sk-PyIqBw7PvNPDaJp-kqv75w
      - TIMEWEB_AI_MODEL=dashscope/qwen3.5-flash
      - UNISENDER_API_KEY=6z7cio4yqpaws6gsyzx93p15id1xmhimzezgedfy
      - UNISENDER_FROM_EMAIL=no-reply@my.neiro-astro.ru
      - UNISENDER_FROM_NAME="AI Астролог"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astro-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - astro-net
    depends_on:
      - backend

  # Astro Service (Python FastAPI)
  astro-service:
    build:
      context: ./astro-service
      dockerfile: Dockerfile
    container_name: astro-python
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./astro-service:/app
    networks:
      - astro-net
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - TIMEWEB_AI_BASE_URL=https://api.timeweb.ai/v1
      - TIMEWEB_AI_API_KEY=sk-PyIqBw7PvNPDaJp-kqv75w
      - TIMEWEB_AI_MODEL=dashscope/qwen3.5-flash
      - UNISENDER_API_KEY=6z7cio4yqpaws6gsyzx93p15id1xmhimzezgedfy
      - UNISENDER_FROM_EMAIL=no-reply@my.neiro-astro.ru
      - UNISENDER_FROM_NAME="AI Астролог"
      - REDIS_PORT=6379

  # Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: astro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - astro-pgdata:/var/lib/postgresql/data
    networks:
      - astro-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: astro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - astro-redisdata:/data
    networks:
      - astro-net

volumes:
  astro-pgdata:
  astro-redisdata:

networks:
  astro-net:
    driver: bridge
