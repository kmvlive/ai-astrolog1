version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ai_astrolog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ai_astrolog}
      POSTGRES_USER: ${DB_USERNAME:-ai_astrolog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - ai_astrolog_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ai_astrolog_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queues
  redis:
    image: redis:7-alpine
    container_name: ai_astrolog_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ai_astrolog_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend + Filament
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_astrolog_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ai_astrolog}
      DB_USERNAME: ${DB_USERNAME:-ai_astrolog_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:80"
    networks:
      - ai_astrolog_net
    command: >
      sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader &&
             php artisan migrate --force &&
             php artisan config:clear &&
             php artisan cache:clear &&
             php artisan view:clear &&
             php-fpm -D &&
             nginx -g 'daemon off;'"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_astrolog_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
      ASTRO_SERVICE_URL: http://astro-service:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - ai_astrolog_net
    command: npm run dev

  # Python Astro Service (FastAPI + Kerykeion)
  astro-service:
    build:
      context: ./astro-service
      dockerfile: Dockerfile
    container_name: ai_astrolog_astro_service
    restart: unless-stopped
    volumes:
      - ./astro-service:/app
    ports:
      - "${ASTRO_PORT:-8001}:8001"
    networks:
      - ai_astrolog_net
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

networks:
  ai_astrolog_net:
    driver: bridge

volumes:
  pgdata:
