<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0f0a1e" />
  <title>Нет соединения — AI Астролог</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, #1a1332 0%, #0a0718 60%, #050309 100%);
      color: #e8e4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 50% 10%, rgba(168,85,247,0.6), transparent);
      pointer-events: none;
    }
    .card {
      position: relative;
      max-width: 360px;
      text-align: center;
      padding: 32px 24px;
      background: rgba(20, 16, 42, 0.7);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    p { font-size: 14px; line-height: 1.55; color: #b8b0d0; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);
      color: #fff;
      border: 0;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(139,92,246,0.35);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(139,92,246,0.5); }
    button:active { transform: translateY(0); }
    .hint { margin-top: 20px; font-size: 11px; color: #6b6285; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🌙</div>
    <h1>Нет соединения</h1>
    <p>Звёзды пока недоступны.<br>Проверьте интернет и попробуйте.</p>
    <button onclick="location.reload()">Попробовать снова</button>
    <div class="hint">Когда связь вернётся — всё заработает</div>
  </div>
</body>
</html>
