services:
  calendar-frontend:
    build:
      context: ./calendar
      dockerfile: Dockerfile
    container_name: calendar-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
    networks:
      - astro-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const http=require(\"http\");http.get(\"http://127.0.0.1:3002/\",r=>{process.exit(r.statusCode<400?0:1)}).on(\"error\",()=>process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  astro-net:
    external: true
    name: ai-astrolog1_astro-net
