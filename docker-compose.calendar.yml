services:
  calendar-frontend:
    build:
      context: ./calendar
      dockerfile: Dockerfile
    container_name: calendar-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
    networks:
      - astro-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "node -e "const h=require('http');const r=h.get('http://127.0.0.1:3002/',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>{r.destroy();process.exit(1)})""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  astro-net:
    external: true
    name: ai-astrolog1_astro-net
